<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css" />
</head>

<body>
    <header>
        <div class="logo">
           <img class="logo-img" src="img/ROC_logo_CMYK_HR-2-1024x748.png" alt="logo roc"> 
        </div>
    </header>
    <main>
        <section class="login-sectie">
            <div class="login-kaart">
                <div class="login-vak">
                    <div class="login-veld">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="name@email.com" />
                    </div>
                    <div class="login-veld">
                        <label>Wachtwoord</label>
                        <input type="password" id="wachtwoord" name="wachtwoord" placeholder="Wachtwoord" />

                    </div>
                    <button class="continue-knop">
                        <label>Verder</label>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
